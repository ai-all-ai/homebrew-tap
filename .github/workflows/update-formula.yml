name: Update Homebrew formula

on:
  schedule:
    - cron: '0 */6 * * *'
  # sent by the release workflow of a package right after it is published, so the formula follows within minutes
  repository_dispatch:
    types: [formula-update]
  workflow_dispatch:
    inputs:
      formula:
        description: 'Formula to update (aiall, ds7, or leave empty for all)'
        required: false
        default: ''

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-homebrew-formulas
  cancel-in-progress: false

jobs:
  update:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        formula:
          - aiall
          - ds7

    steps:
      - uses: actions/checkout@v6
        with:
          ref: main

      # Rewrites the workspace, so it must precede any file changes.
      - uses: Homebrew/actions/setup-homebrew@75064b260aea50a4b3dd1352975747d5576aaf05 # main

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Test version decision
        if: inputs.formula == '' || inputs.formula == matrix.formula
        run: node --test

      - name: Check npm and update formula if a newer stable version is published
        id: update
        if: inputs.formula == '' || inputs.formula == matrix.formula
        run: node scripts/update-formula.mjs ${{ matrix.formula }}

      - name: Audit and install updated formula
        if: steps.update.outputs.changed == 'true'
        run: bash scripts/test-formula.sh Formula/${{ matrix.formula }}.rb

      - name: Open or update the version-specific pull request
        if: steps.update.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: automation/${{ matrix.formula }}-v${{ steps.update.outputs.version }}
          delete-branch: true
          author: ai-all-ai <ai.all.ruw@gmail.com>
          committer: ai-all-ai <ai.all.ruw@gmail.com>
          commit-message: 'chore(${{ matrix.formula }}): update formula to ${{ steps.update.outputs.version }}'
          title: 'chore(${{ matrix.formula }}): update formula to ${{ steps.update.outputs.version }}'
          body: |
            Update `Formula/${{ matrix.formula }}.rb` to the stable npm release `${{ steps.update.outputs.version }}`.

            The updater downloaded the registry tarball, checked its SHA-512 registry integrity and computed its SHA-256. Ruby syntax, `brew audit`, installation and `brew test` passed before this PR was opened.
